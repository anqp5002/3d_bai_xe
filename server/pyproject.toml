[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim3d-server"
version = "0.1.0"
description = "BE nội bộ của web SIM3D (chỉ nghe 127.0.0.1)"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["sim3d_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
